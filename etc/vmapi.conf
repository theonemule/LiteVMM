# VMAPI host configuration. Install to /etc/vmapi/vmapi.conf.
# This file is sourced by lib/common.sh. Values establish safe default paths and QEMU settings.
# VM configuration, VM disks, and install media are intentionally separate.

# Deployment profile. The API is always installed; the profile controls which
# workload endpoints and host dependencies are enabled.
# virtualization = QEMU/KVM + networking + VM backups
# docker                 = Docker/Compose management
# virtualization-docker  = virtualization + Docker/Compose; backups included
# backup                 = paired backup receiver and archive management only
VMAPI_PROFILE=virtualization

# Management HTTP(S) port. The installer defaults new hosts to 5186 and may
# override this value without changing the workload profile.
VMAPI_HTTP_PORT=5186

# TLS is optional. certctl manages these values when Certbot is enabled.
VMAPI_TLS_ENABLED=false
VMAPI_TLS_DOMAIN=
VMAPI_TLS_CERT_FILE=
VMAPI_TLS_KEY_FILE=

VM_ROOT=/var/lib/vmapi/vms
DISK_ROOT=/var/lib/vmapi/disks
ISO_ROOT=/var/lib/vmapi/isos
REPLICA_ROOT=/var/lib/vmapi/replicas
QEMU_BIN=/usr/bin/qemu-system-x86_64
QEMU_IMG=/usr/bin/qemu-img
QEMU_NBD=/usr/bin/qemu-nbd
XORRISO_BIN=/usr/bin/xorriso
DEFAULT_MACHINE=q35
DEFAULT_CPU=host
DEFAULT_MEMORY_MB=2048
DEFAULT_VCPUS=2
DEFAULT_DISK_FORMAT=qcow2
DEFAULT_DISK_BUS=virtio
DEFAULT_NIC_MODEL=virtio-net-pci
DEFAULT_VNC_BIND=127.0.0.1
STOP_TIMEOUT=20
# Debian normally provides these with the ovmf package. vmctl probes common paths too.
OVMF_CODE=
OVMF_VARS_TEMPLATE=

# Docker CLI used to talk to the local Docker daemon.
DOCKER_BIN=/usr/bin/docker
