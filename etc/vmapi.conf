# VMAPI host configuration. Install to /etc/vmapi/vmapi.conf.
# This file is sourced by lib/common.sh. Values establish safe default paths and QEMU settings.
# VM configuration, VM disks, and install media are intentionally separate.

# Deployment profile. The API is always installed; the profile controls which
# workload endpoints and host dependencies are enabled.
# backup                 = backup storage only
# virtualization         = VM + backup
# docker                 = Docker + backup
# virtualization-docker  = VM + Docker + backup
VMAPI_PROFILE=virtualization

# Management HTTP(S) port. The installer defaults new hosts to 5186 and may
# override this value without changing the workload profile.
VMAPI_HTTP_PORT=5186

# TLS is optional. certctl manages Let's Encrypt, CSR, and imported certificates.
VMAPI_TLS_ENABLED=false
VMAPI_TLS_MODE=none
VMAPI_TLS_DOMAIN=
VMAPI_TLS_CERT_FILE=
VMAPI_TLS_KEY_FILE=
VMAPI_TLS_CSR_FILE=
VMAPI_TLS_CSR_KEY_FILE=
VMAPI_TLS_CSR_DOMAIN=
VMAPI_TLS_ROOT=/etc/vmapi/tls

# Trusted peer storage backplane. Backup-capable profiles export an NFSv4
# filesystem only on loopback and expose it to paired hosts through the existing
# HTTP(S) WebSocket endpoint. Clients mount one shared backplane per storage peer.
VMAPI_BACKPLANE_SERVER=false
VMAPI_BACKPLANE_ROOT=/var/lib/vmapi/backplane
VMAPI_BACKPLANE_MOUNT_ROOT=/var/lib/vmapi/peer-storage
VMAPI_BACKPLANE_NFS_BIND=127.0.0.1
VMAPI_BACKPLANE_NFS_PORT=2049
VMAPI_BACKPLANE_NFS_EXPORT_CLIENT=127.0.0.1
VMAPI_BACKPLANE_WS_BIND=127.0.0.1
VMAPI_BACKPLANE_WS_PORT=6091

VM_ROOT=/var/lib/vmapi/vms
DISK_ROOT=/var/lib/vmapi/disks
ISO_ROOT=/var/lib/vmapi/isos
QEMU_BIN=/usr/bin/qemu-system-x86_64
QEMU_IMG=/usr/bin/qemu-img
XORRISO_BIN=/usr/bin/xorriso
DEFAULT_MACHINE=q35
DEFAULT_CPU=host
DEFAULT_MEMORY_MB=2048
DEFAULT_VCPUS=2
DEFAULT_DISK_FORMAT=qcow2
DEFAULT_DISK_BUS=virtio
DEFAULT_NIC_MODEL=virtio-net-pci
DEFAULT_VNC_BIND=127.0.0.1
STOP_TIMEOUT=20
# Debian normally provides these with the ovmf package. vmctl probes common paths too.
OVMF_CODE=
OVMF_VARS_TEMPLATE=

# Docker CLI used to talk to the local Docker daemon.
DOCKER_BIN=/usr/bin/docker
# Aggregate image metadata across trusted peers. Peer-only images remain on the
# owning host and may be used as read-only remote rootfs layers. Container
# writes always stay local under VMAPI_DOCKER_REMOTE_LAYER_ROOT.
VMAPI_DOCKER_FEDERATION=true
VMAPI_DOCKER_REMOTE_RUNTIME=litevmm-remote
VMAPI_DOCKER_ROOTFS_EXPORT_ROOT=/var/lib/vmapi/backplane/shared/docker-rootfs
VMAPI_DOCKER_REMOTE_LAYER_ROOT=/var/lib/vmapi/remote-container-layers
VMAPI_DOCKER_CONTAINERD_ADDRESS=/var/run/docker/containerd/containerd.sock
VMAPI_DOCKER_CONTAINERD_NAMESPACE=moby
