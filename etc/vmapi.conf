# VMAPI host configuration. Install to /etc/vmapi/vmapi.conf.
# This file is sourced by lib/common.sh. Values establish safe default paths and QEMU settings.
# VM configuration, VM disks, and install media are intentionally separate.
VM_ROOT=/var/lib/vmapi/vms
DISK_ROOT=/var/lib/vmapi/disks
ISO_ROOT=/var/lib/vmapi/isos
QEMU_BIN=/usr/bin/qemu-system-x86_64
QEMU_IMG=/usr/bin/qemu-img
DEFAULT_MACHINE=q35
DEFAULT_CPU=host
DEFAULT_MEMORY_MB=2048
DEFAULT_VCPUS=2
DEFAULT_DISK_FORMAT=qcow2
DEFAULT_DISK_BUS=virtio
DEFAULT_NIC_MODEL=virtio-net-pci
DEFAULT_VNC_BIND=127.0.0.1
STOP_TIMEOUT=20
# Debian normally provides these with the ovmf package. vmctl probes common paths too.
OVMF_CODE=
OVMF_VARS_TEMPLATE=

# Docker CLI used to talk to the local Docker daemon.
DOCKER_BIN=/usr/bin/docker
