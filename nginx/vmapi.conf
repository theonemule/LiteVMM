# Debian/nginx virtual-host fragment. Nginx is the authenticated public edge and proxies FastCGI, noVNC, ttyd, and overlay traffic to local services.
server {
    listen 127.0.0.1:5186;
    server_name _;

    client_max_body_size 20G;

    # Protocol-transition probe. This exact static image is intentionally
    # unauthenticated so an HTTP console can detect when the same endpoint is
    # accepting HTTPS before redirecting the browser. It exposes no host data.
    location = /healthz.svg {
        root /usr/share/vmapi/www;
        try_files /healthz.svg =404;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # The UI and API share the same PAM-backed HTTP Basic authentication.
    # The browser caches the Basic credentials for this origin and automatically
    # reuses them for same-origin /api requests; the JavaScript never sees them.
    location / {
        auth_pam "VM API";
        auth_pam_service_name "nginx-vmapi";

        root /usr/share/vmapi/www;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location /api/ {
        auth_pam "VM API";
        auth_pam_service_name "nginx-vmapi";

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/vmapi/cgi/api.cgi;
        fastcgi_param SCRIPT_NAME /api;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/fcgiwrap-vmapi.sock;

        fastcgi_read_timeout 3600s;
        fastcgi_request_buffering off;
    }

    # Same-origin browser terminals. ttyd listens only on loopback; Nginx keeps
    # the same PAM authentication boundary as the rest of the management UI.
    location /docker/terminal/ {
        auth_pam "VM API";
        auth_pam_service_name "nginx-vmapi";
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /host/terminal/ {
        auth_pam "VM API";
        auth_pam_service_name "nginx-vmapi";
        proxy_pass http://127.0.0.1:7682;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Optional local CNCF Distribution registry, bound only to loopback.
    include /etc/nginx/vmapi-registry.conf;

    # Peer storage backplane. NFS itself is bound only to loopback; paired
    # hosts reach it only through this authenticated WebSocket route.
    location = /backplane/storage {
        auth_basic "VMAPI peers";
        auth_basic_user_file /etc/vmapi-peer.htpasswd;
        proxy_pass http://127.0.0.1:6091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Paired hosts use the same Basic credential as hub WebSocket upgrades.
    location ~ ^/peer-api(?:/|$)(.*)$ {
        auth_basic "VMAPI peers";
        auth_basic_user_file /etc/vmapi-peer.htpasswd;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/vmapi/cgi/peer-api.cgi;
        fastcgi_param SCRIPT_NAME /peer-api;
        fastcgi_param VMAPI_PEER_API true;
        fastcgi_param AUTH_TYPE Basic;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param PATH_INFO /api/$1;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass unix:/run/fcgiwrap-vmapi.sock;

        fastcgi_read_timeout 3600s;
        fastcgi_request_buffering off;
    }
}
