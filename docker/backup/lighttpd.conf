server.modules = (
  "mod_auth",
  "mod_authn_file",
  "mod_fastcgi",
  "mod_cgi",
  "mod_alias",
  "mod_rewrite",
  "mod_proxy",
  "mod_setenv"
)
server.document-root = "/usr/share/vmapi/www"
server.bind = "0.0.0.0"
server.port = @PORT@
server.username = "lighttpd"
server.groupname = "lighttpd"
server.pid-file = "/run/lighttpd.pid"
server.errorlog = "/dev/stderr"
index-file.names = ( "index.html" )

mimetype.assign = (
  ".html" => "text/html",
  ".js" => "application/javascript",
  ".css" => "text/css",
  ".svg" => "image/svg+xml",
  ".png" => "image/png"
)

auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/lighttpd/vmapi.htpasswd"
$HTTP["url"] =~ "^/(replication(?:/|$)|remote-fs(?:/|$)|remote-fs-ws[.]py(?:/|$)|peer-api(?:/|$)|peer-api[.]cgi(?:/|$))" {
  auth.backend.htpasswd.userfile = "/etc/vmapi-peer.htpasswd"
  auth.require = ( "" => ( "method" => "basic", "realm" => "LiteVMM peers", "require" => "valid-user" ) )
}
$HTTP["url"] !~ "^/(replication(?:/|$)|remote-fs(?:/|$)|remote-fs-ws[.]py(?:/|$)|peer-api(?:/|$)|peer-api[.]cgi(?:/|$))" {
  auth.require = ( "/" => ( "method" => "basic", "realm" => "LiteVMM", "require" => "valid-user" ) )
}

alias.url = (
  "/api.cgi" => "/usr/lib/vmapi/cgi/api.cgi",
  "/peer-api.cgi" => "/usr/lib/vmapi/cgi/peer-api.cgi",
  "/remote-fs-ws.py" => "/usr/lib/vmapi/cgi/remote-fs-ws.py"
)
fastcgi.server = (
  ".cgi" => (( "socket" => "/run/vmapi/fcgi.sock", "check-local" => "enable" ))
)
url.rewrite-once = (
  "^/api/?(.*)$" => "/api.cgi/$1",
  "^/peer-api/?(.*)$" => "/peer-api.cgi/$1",
  "^/remote-fs/([a-f0-9]{48})/?$" => "/remote-fs-ws.py/$1"
)
$HTTP["url"] =~ "^/remote-fs-ws[.]py(?:/|$)" {
  cgi.assign = ( ".py" => "/usr/bin/python3" )
  cgi.upgrade = "enable"
}

url.rewrite-if-not-file = (
  "^/(?!(api|peer-api|remote-fs|remote-fs-ws[.]py|replication)(?:/|$)).*" => "/index.html"
)
setenv.add-response-header = (
  "Cache-Control" => "no-cache",
  "X-Content-Type-Options" => "nosniff",
  "Referrer-Policy" => "no-referrer",
  "Content-Security-Policy" => "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
)
server.max-read-idle = 3600
server.max-write-idle = 3600

include_shell "cat /run/vmapi/conf.d/*.conf"
