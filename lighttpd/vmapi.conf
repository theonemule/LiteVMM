# Alpine/lighttpd virtual-host fragment. It authenticates users, serves the static UI, and routes protected paths to FastCGI or local proxy services.
server.modules += (
  "mod_auth",
  "mod_authn_file",
  "mod_fastcgi",
  "mod_cgi",
  "mod_alias",
  "mod_proxy",
  "mod_rewrite",
  "mod_setenv"
)

auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/lighttpd/vmapi.htpasswd"
# Browser login and paired hosts have separate user databases. Every peer API
# request and WebSocket upgrade uses the SAME paired HTTP Basic credential.
$HTTP["url"] =~ "^/(backplane/storage(?:/|$)|peer-api(?:/|$)|peer-api[.]cgi(?:/|$))" {
  auth.backend.htpasswd.userfile = "/etc/vmapi-peer.htpasswd"
  auth.require = ( "" => ( "method" => "basic", "realm" => "VMAPI peers", "require" => "valid-user" ) )
}
# Per-overlay routes below restrict access to their selected paired users.
$HTTP["url"] !~ "^/(overlay(?:/|$)|backplane/storage(?:/|$)|v2(?:/|$)|peer-api(?:/|$)|peer-api[.]cgi(?:/|$)|healthz[.]svg$)" {
  auth.require = (
    "/" => (
      "method" => "basic",
      "realm" => "VM API",
      "require" => "valid-user"
    )
  )
}

alias.url += (
  "/api.cgi" => "/usr/lib/vmapi/cgi/api.cgi",
  "/peer-api.cgi" => "/usr/lib/vmapi/cgi/peer-api.cgi",
  "/novnc" => "@NOVNC_ROOT@"
)

fastcgi.server = (
  ".cgi" => ((
    "socket" => "/run/fcgiwrap-vmapi.sock",
    "check-local" => "enable"
  ))
)

url.rewrite-once = (
  "^/api/?(.*)$" => "/api.cgi/$1",
  "^/peer-api/?(.*)$" => "/peer-api.cgi/$1"
)


$HTTP["url"] =~ "^/backplane/storage(?:/|$)" {
  proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 6091 )) )
  proxy.header = ( "upgrade" => "enable" )
}

$HTTP["url"] =~ "^/docker/terminal/" {
  proxy.server = ( "/docker/terminal/" => (( "host" => "127.0.0.1", "port" => 7681 )) )
  proxy.header = ( "upgrade" => "enable" )
}
$HTTP["url"] =~ "^/host/terminal/" {
  proxy.server = ( "/host/terminal/" => (( "host" => "127.0.0.1", "port" => 7682 )) )
  proxy.header = ( "upgrade" => "enable" )
}

url.rewrite-if-not-file = (
  "^/(?!(api|peer-api|backplane|overlay|v2|console|novnc|docker/terminal|host/terminal)(?:/|$)).*" => "/index.html"
)

setenv.add-response-header = (
  "Cache-Control" => "no-cache",
  "X-Content-Type-Options" => "nosniff",
  "Referrer-Policy" => "no-referrer",
  "Content-Security-Policy" => "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
)

server.max-read-idle = 3600
server.max-write-idle = 3600
